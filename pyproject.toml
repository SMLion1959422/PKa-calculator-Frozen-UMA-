[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "umapka"
version = "0.1.0"
description = "pKa prediction from UMA foundation-model embeddings"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
    "lightgbm",
    "joblib",
    "rdkit",
    "ase",
    "fairchem-core",
]

[project.urls]
Homepage = "https://github.com/SMLion1959422/umapka"

[tool.setuptools.packages.find]
include = ["umapka*"]
